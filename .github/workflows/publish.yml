name: Publish

# Veroeffentlicht ueber Trusted Publishing (OIDC) - kein Token, kein Mensch.
# Voraussetzung: auf npmjs.com unter Package -> Settings -> Trusted publishing
# eingetragen mit Repository PatrickPi1312/eucompliance-ai-act-ts und
# Workflow-Datei publish.yml. Das geht erst, wenn 0.1.0 einmal von Hand
# veroeffentlicht wurde - npm legt die Einstellungsseite erst dann an.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish